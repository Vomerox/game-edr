<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Dégradé fond bouclier -->
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a2f1a"/>
      <stop offset="40%" stop-color="#1e190f"/>
      <stop offset="100%" stop-color="#0d0a05"/>
    </linearGradient>
    <!-- Dégradé bordure dorée -->
    <linearGradient id="goldBorder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8c84a"/>
      <stop offset="50%" stop-color="#d4a84b"/>
      <stop offset="100%" stop-color="#8b7355"/>
    </linearGradient>
    <!-- Dégradé câble vert -->
    <linearGradient id="cableGreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#44cc44"/>
      <stop offset="50%" stop-color="#66ff66"/>
      <stop offset="100%" stop-color="#44cc44"/>
    </linearGradient>
    <!-- Lueur texte -->
    <filter id="glowGold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowGreen" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="innerShadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="blur"/>
      <feOffset dx="0" dy="4" result="offsetBlur"/>
      <feComposite in="SourceGraphic" in2="offsetBlur" operator="over"/>
    </filter>
    <!-- Motif rivets -->
    <pattern id="sandTexture" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="none"/>
      <circle cx="4" cy="4" r="0.5" fill="#5c4a2e" opacity="0.3"/>
    </pattern>
  </defs>

  <!-- === FORME BOUCLIER MILITAIRE === -->
  <!-- Ombre portée -->
  <path d="M256 28 L440 90 L440 270 Q440 380 256 488 Q72 380 72 270 L72 90 Z"
        fill="#000" opacity="0.4" transform="translate(4, 6)"/>

  <!-- Bordure extérieure dorée -->
  <path d="M256 28 L440 90 L440 270 Q440 380 256 488 Q72 380 72 270 L72 90 Z"
        fill="url(#goldBorder)" stroke="#e8c84a" stroke-width="2"/>

  <!-- Fond intérieur sombre -->
  <path d="M256 42 L428 100 L428 268 Q428 372 256 474 Q84 372 84 268 L84 100 Z"
        fill="url(#shieldGrad)"/>

  <!-- Texture subtile -->
  <path d="M256 42 L428 100 L428 268 Q428 372 256 474 Q84 372 84 268 L84 100 Z"
        fill="url(#sandTexture)" opacity="0.5"/>

  <!-- Ligne décorative intérieure -->
  <path d="M256 56 L416 112 L416 264 Q416 362 256 460 Q96 362 96 264 L96 112 Z"
        fill="none" stroke="#5c4a2e" stroke-width="2" opacity="0.6"/>

  <!-- === BANDE HORIZONTALE MILITAIRE === -->
  <rect x="84" y="195" width="344" height="70" fill="#2a2210" opacity="0.9"/>
  <line x1="84" y1="195" x2="428" y2="195" stroke="#8b7355" stroke-width="2"/>
  <line x1="84" y1="265" x2="428" y2="265" stroke="#8b7355" stroke-width="2"/>

  <!-- === TEXTE "EDR" PRINCIPAL === -->
  <text x="256" y="255" text-anchor="middle" font-family="Arial Black, Impact, sans-serif"
        font-size="72" font-weight="900" fill="#e8d5a3" letter-spacing="18"
        filter="url(#glowGold)">EDR</text>
  <!-- Ombre du texte -->
  <text x="258" y="250" text-anchor="middle" font-family="Arial Black, Impact, sans-serif"
        font-size="72" font-weight="900" fill="#1a1408" letter-spacing="18" opacity="0.4">EDR</text>
  <!-- Texte doré par-dessus -->
  <text x="256" y="255" text-anchor="middle" font-family="Arial Black, Impact, sans-serif"
        font-size="72" font-weight="900" fill="#d4a84b" letter-spacing="18">EDR</text>

  <!-- === SOUS-TITRE "GAME" === -->
  <text x="256" y="178" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="22" font-weight="700" fill="#8b7355" letter-spacing="16">GAME</text>

  <!-- === ÉTOILES MILITAIRES === -->
  <!-- Étoile centrale haute -->
  <polygon points="256,72 262,88 280,88 266,98 271,114 256,105 241,114 246,98 232,88 250,88"
           fill="#d4a84b" filter="url(#glowGold)"/>
  <!-- Étoile gauche -->
  <polygon points="175,100 179,112 192,112 182,119 185,131 175,124 165,131 168,119 158,112 171,112"
           fill="#8b7355"/>
  <!-- Étoile droite -->
  <polygon points="337,100 341,112 354,112 344,119 347,131 337,124 327,131 330,119 320,112 333,112"
           fill="#8b7355"/>

  <!-- === SCHÉMA RÉSEAU (nœuds + câbles) === -->

  <!-- Câble gauche : PC_Alpha → Routeur -->
  <line x1="148" y1="360" x2="220" y2="330" stroke="#b8941e" stroke-width="4" opacity="0.5"/>
  <line x1="148" y1="360" x2="220" y2="330" stroke="url(#cableGreen)" stroke-width="2.5"
        filter="url(#glowGreen)" opacity="0.9"/>

  <!-- Câble central : Routeur → Routeur -->
  <line x1="232" y1="330" x2="280" y2="330" stroke="#b8941e" stroke-width="4" opacity="0.5"/>
  <line x1="232" y1="330" x2="280" y2="330" stroke="url(#cableGreen)" stroke-width="2.5"
        filter="url(#glowGreen)" opacity="0.9"/>

  <!-- Câble droite : Routeur → PC_Bravo -->
  <line x1="292" y1="330" x2="364" y2="360" stroke="#b8941e" stroke-width="4" opacity="0.5"/>
  <line x1="292" y1="330" x2="364" y2="360" stroke="url(#cableGreen)" stroke-width="2.5"
        filter="url(#glowGreen)" opacity="0.9"/>

  <!-- Nœud PC Alpha (carré avec antenne) -->
  <rect x="128" y="350" width="40" height="30" rx="3" fill="#4a5a3a" stroke="#8b7355" stroke-width="2"/>
  <rect x="133" y="355" width="30" height="14" rx="2" fill="#1a2a10" opacity="0.8"/>
  <!-- Petit écran -->
  <rect x="136" y="357" width="24" height="10" rx="1" fill="#2a4a1a"/>
  <text x="148" y="365" text-anchor="middle" font-family="monospace" font-size="7" fill="#66ff66">IP</text>
  <!-- Antenne -->
  <line x1="148" y1="350" x2="148" y2="338" stroke="#a0a0a0" stroke-width="1.5"/>
  <circle cx="148" cy="336" r="2.5" fill="#ff4444"/>

  <!-- Nœud Routeur 1 (hexagonal/militaire) -->
  <polygon points="226,314 240,308 254,314 254,332 240,338 226,332"
           fill="#5c4a2e" stroke="#d4a84b" stroke-width="2"/>
  <text x="240" y="328" text-anchor="middle" font-family="monospace" font-size="9"
        font-weight="bold" fill="#e8d5a3">R1</text>
  <!-- Flèches de routage -->
  <polygon points="236,312 240,306 244,312" fill="#44cc44" opacity="0.7"/>

  <!-- Nœud Routeur 2 (hexagonal/militaire) -->
  <polygon points="272,314 286,308 300,314 300,332 286,338 272,332"
           fill="#5c4a2e" stroke="#d4a84b" stroke-width="2"/>
  <text x="286" y="328" text-anchor="middle" font-family="monospace" font-size="9"
        font-weight="bold" fill="#e8d5a3">R2</text>
  <!-- Flèches de routage -->
  <polygon points="282,312 286,306 290,312" fill="#44cc44" opacity="0.7"/>

  <!-- Nœud PC Bravo (carré avec antenne) -->
  <rect x="344" y="350" width="40" height="30" rx="3" fill="#4a5a3a" stroke="#8b7355" stroke-width="2"/>
  <rect x="349" y="355" width="30" height="14" rx="2" fill="#1a2a10" opacity="0.8"/>
  <rect x="352" y="357" width="24" height="10" rx="1" fill="#2a4a1a"/>
  <text x="364" y="365" text-anchor="middle" font-family="monospace" font-size="7" fill="#66ff66">IP</text>
  <!-- Antenne -->
  <line x1="364" y1="350" x2="364" y2="338" stroke="#a0a0a0" stroke-width="1.5"/>
  <circle cx="364" cy="336" r="2.5" fill="#ff4444"/>

  <!-- Labels Eth sous les routeurs -->
  <text x="240" y="348" text-anchor="middle" font-family="monospace" font-size="7" fill="#a08050">Eth0|Eth1</text>
  <text x="286" y="348" text-anchor="middle" font-family="monospace" font-size="7" fill="#a08050">Eth0|Eth1</text>

  <!-- === ONDES RADIO (arcs décoratifs) === -->
  <path d="M145 330 Q135 320 145 310" fill="none" stroke="#66ff66" stroke-width="1" opacity="0.4"/>
  <path d="M140 334 Q126 318 140 304" fill="none" stroke="#66ff66" stroke-width="1" opacity="0.25"/>
  <path d="M367 330 Q377 320 367 310" fill="none" stroke="#66ff66" stroke-width="1" opacity="0.4"/>
  <path d="M372 334 Q386 318 372 304" fill="none" stroke="#66ff66" stroke-width="1" opacity="0.25"/>

  <!-- === RIVETS DÉCORATIFS (coins du bouclier) === -->
  <circle cx="115" cy="120" r="4" fill="#3a2f1a" stroke="#8b7355" stroke-width="1.5"/>
  <circle cx="115" cy="120" r="1.5" fill="#5c4a2e"/>
  <circle cx="397" cy="120" r="4" fill="#3a2f1a" stroke="#8b7355" stroke-width="1.5"/>
  <circle cx="397" cy="120" r="1.5" fill="#5c4a2e"/>
  <circle cx="108" cy="230" r="4" fill="#3a2f1a" stroke="#8b7355" stroke-width="1.5"/>
  <circle cx="108" cy="230" r="1.5" fill="#5c4a2e"/>
  <circle cx="404" cy="230" r="4" fill="#3a2f1a" stroke="#8b7355" stroke-width="1.5"/>
  <circle cx="404" cy="230" r="1.5" fill="#5c4a2e"/>
</svg>